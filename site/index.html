<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Insights</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F4F5F2;--surface:#FFFFFF;--ink:#1A2420;--muted:#5C6B63;--rule:#D8DDD8;--accent:#1E5A47;--accent-soft:#E3EEE8;--ochre:#B8741F;--ochre-soft:#F6EBDA;--warn:#A33A2C;--code:#EEF1EE;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--s9:#8a948e;--s10:#c4cbc6;
  --display:"Source Serif 4",Georgia,serif;--body:"IBM Plex Sans",Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0F1512;--surface:#161D19;--ink:#E6EAE6;--muted:#98A59E;--rule:#2A342E;--accent:#5FB894;--accent-soft:#1B2E27;--ochre:#E0A04A;--ochre-soft:#3A2A14;--warn:#E28477;--code:#1C2420;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#7d867f;--s10:#3f4843}}
:root[data-theme="dark"]{--ground:#0F1512;--surface:#161D19;--ink:#E6EAE6;--muted:#98A59E;--rule:#2A342E;--accent:#5FB894;--accent-soft:#1B2E27;--ochre:#E0A04A;--ochre-soft:#3A2A14;--warn:#E28477;--code:#1C2420;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#7d867f;--s10:#3f4843}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
a{color:var(--accent)}
header.top{display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid var(--rule);background:var(--surface);flex-wrap:wrap}
header.top h1{font-family:var(--display);font-size:20px;margin:0;font-weight:600}
header.top .sub{color:var(--muted);font-size:12.5px}
header.top .spacer{flex:1}
nav.main{display:flex;flex-wrap:wrap;gap:2px;padding:6px 20px;background:var(--surface);border-bottom:1px solid var(--rule)}
nav.main a{padding:6px 10px;text-decoration:none;color:var(--muted);border-radius:3px;font-size:13px}
nav.main a.active,nav.main a:hover{color:var(--accent);background:var(--accent-soft)}
main{max-width:1280px;margin:0 auto;padding:22px 24px 80px}
h2{font-family:var(--display);font-size:24px;margin:0 0 4px;font-weight:600}
h3{font-size:15px;margin:26px 0 8px;font-weight:600}
p.lede{color:var(--muted);margin:0 0 18px;max-width:80ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.tile{background:var(--surface);border:1px solid var(--rule);padding:10px 12px}
.tile .n{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:var(--surface);border:1px solid var(--rule);padding:14px 16px;margin:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--ground);position:sticky;top:0;cursor:pointer;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:var(--accent-soft)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
select,input[type=search],input[type=text]{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px}
button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
svg text{font-family:var(--body);fill:var(--ink)}
svg .muted{fill:var(--muted)}
svg .grid{stroke:var(--rule);stroke-width:1}
.bar-row{display:grid;grid-template-columns:200px 1fr 90px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .lbl .note{display:block;white-space:normal;line-height:1.25}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar-row .track{height:12px;background:var(--code);position:relative}
.bar-row .track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.stack{display:flex;height:16px;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.delta-pos{color:var(--accent);font-weight:500}.delta-neg{color:var(--warn);font-weight:500}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:var(--code);color:var(--muted)}
.pill.est{background:var(--ochre-soft);color:var(--ochre)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:#f7e2df;color:var(--warn)}
.callout{background:var(--ochre-soft);border-left:3px solid var(--ochre);padding:10px 14px;margin:12px 0;font-size:13px}
.note{color:var(--muted);font-size:12.5px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);padding:6px 9px;font-size:12px;border-radius:3px;display:none;z-index:9;max-width:320px}
code{font-family:var(--mono);font-size:12px;background:var(--code);padding:1px 4px}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:12.5px;color:var(--muted)}
footer{max-width:1280px;margin:0 auto;padding:12px 24px 40px;color:var(--muted);font-size:12px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
<header class="top">
  <div><h1>Super Insights</h1><div class="sub">Australian superannuation holdings, managers, strategic allocation and fees — from public disclosures</div></div>
  <div class="spacer"></div>
  <label class="sub">Snapshot <select id="snap"></select></label>
</header>
<nav class="main" id="nav"></nav>
<main id="main"><p class="note">Loading…</p></main>
<footer>Data: trustee Portfolio Holdings Disclosures (Corporations Regulations 2001, Schedule 8D) and APRA statistics. Manager fee figures are estimates. Not investment advice. <span id="built"></span></footer>
<div class="tip" id="tip"></div>
<script>
const BUCKETS=["Australian Equity","International Equity","Australian Fixed Income","International Fixed Income","Infrastructure","Property","Private Equity","Alternatives","Cash","Other"];
const SLOT={};BUCKETS.forEach((b,i)=>SLOT[b]=`var(--s${i+1})`);
const PAGES=[["overview","Market Overview"],["compare","Fund Comparison"],["explorer","Holdings Explorer"],["fund","Fund Deep-Dive"],["profiles","Fund Profiles"],["owners","Asset Owners"],["managers","Manager League"],["alts","Alternatives & Hedge Funds"],["fees","Fees & Economics"],["drift","Target vs Actual"],["timeseries","Time Series"],["apra","APRA Strategic Allocation"],["quality","Data Quality"],["method","Methodology"]];
const state={snap:null,index:null,cache:{}};
const $=s=>document.querySelector(s);
const fmt$=v=>v==null||isNaN(v)?"—":Math.abs(v)>=1e9?`$${(v/1e9).toFixed(1)}bn`:Math.abs(v)>=1e6?`$${(v/1e6).toFixed(0)}m`:Math.abs(v)>=1e3?`$${(v/1e3).toFixed(0)}k`:`$${v.toFixed(0)}`;
const pct=v=>v==null||isNaN(v)?"—":`${(+v).toFixed(1)}%`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short=(o)=>`${o.fund_name} — ${o.option_name}`;
async function data(name){const k=`${state.snap}/${name}`;if(!state.cache[k]){const r=await fetch(`data/${k}.json`);state.cache[k]=r.ok?await r.json():null;}return state.cache[k];}
const tip=$("#tip");
document.addEventListener("mousemove",e=>{if(tip.style.display==="block"){tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";}});
function hover(el,html){el.addEventListener("mouseenter",()=>{tip.innerHTML=html;tip.style.display="block";});el.addEventListener("mouseleave",()=>tip.style.display="none");}
function legend(keys){return `<div class="legend">${keys.map(k=>`<span style="--c:${SLOT[k]}">${esc(k)}</span>`).join("")}</div>`;}
function stack(alloc,label){const w=document.createElement("div");w.className="stack";BUCKETS.forEach(b=>{const v=alloc[b]||0;if(v<=0)return;const i=document.createElement("i");i.style.width=v+"%";i.style.background=SLOT[b];hover(i,`<b>${esc(label)}</b><br>${esc(b)}: ${pct(v)}`);w.appendChild(i);});return w;}
function barRows(items,{label,value,max,fmt=fmt$,onclick}={}){const box=document.createElement("div");const m=max||Math.max(...items.map(value));items.forEach(it=>{const r=document.createElement("div");r.className="bar-row";r.innerHTML=`<div class="lbl" title="${esc(label(it))}">${esc(label(it))}</div><div class="track"><i style="width:${m?value(it)/m*100:0}%"></i></div><div class="val">${fmt(value(it))}</div>`;if(onclick){r.style.cursor="pointer";r.onclick=()=>onclick(it);}box.appendChild(r);});return box;}
function table(cols,rows,{sortable=true,id=""}={}){let sortKey=null,asc=false;const wrap=document.createElement("div");wrap.className="tbl";const render=()=>{const rs=sortKey?[...rows].sort((a,b)=>{const x=a[sortKey],y=b[sortKey];if(x==null)return 1;if(y==null)return -1;return (typeof x==="number"?x-y:String(x).localeCompare(String(y)))*(asc?1:-1);}):rows;wrap.innerHTML=`<table id="${id}"><thead><tr>${cols.map(c=>`<th class="${c.num?"num":""}" data-k="${c.k}">${esc(c.h)}${sortKey===c.k?(asc?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${cols.map(c=>`<td class="${c.num?"num":""}">${c.f?c.f(r[c.k],r):esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;if(sortable)wrap.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=sortKey===k?!asc:false;sortKey=k;render();});};render();return wrap;}
function delta(v){if(v==null)return "—";const c=v>0?"delta-pos":v<0?"delta-neg":"";return `<span class="${c}">${v>0?"+":""}${(+v).toFixed(1)}</span>`;}
function groupedBars(series,labels,{height=220,fmt=pct}={}){
  // series: [{name, values[], color}] ; one shared scale, direct value labels on the first series only
  const n=labels.length,W=Math.max(640,n*70),H=height,pad={l:90,r:10,t:10,b:64},max=Math.max(...series.flatMap(s=>s.values))*1.15||1;
  const x=i=>pad.l+i*(W-pad.l-pad.r)/n,bw=(W-pad.l-pad.r)/n/(series.length+1),y=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">`;
  for(let t=0;t<=4;t++){const v=max*t/4;s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="muted" x="${pad.l-4}" y="${y(v)+4}" font-size="10" text-anchor="end">${v.toFixed(0)}%</text>`;}
  labels.forEach((l,i)=>{series.forEach((se,j)=>{const v=se.values[i]||0;s+=`<rect x="${x(i)+bw*(j+0.5)}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" fill="${se.color}" rx="2"><title>${esc(l)} — ${esc(se.name)}: ${fmt(v)}</title></rect>`;if(j===0&&v>0)s+=`<text x="${x(i)+bw*(j+0.5)+(bw-2)/2}" y="${y(v)-3}" font-size="10" text-anchor="middle">${v.toFixed(0)}</text>`;});
    s+=`<text x="${x(i)+(W-pad.l-pad.r)/n/2}" y="${H-pad.b+14}" font-size="10" text-anchor="end" transform="rotate(-35 ${x(i)+(W-pad.l-pad.r)/n/2} ${H-pad.b+14})">${esc(l.length>19?l.slice(0,18)+"…":l)}</text>`;});
  return s+`</svg><div class="legend">${series.map(se=>`<span style="--c:${se.color}">${esc(se.name)}</span>`).join("")}</div>`;
}
function lines(seriesList,xs,{height=220,fmt=pct}={}){const W=720,H=height,pad={l:44,r:110,t:10,b:30};const all=seriesList.flatMap(s=>s.values).filter(v=>v!=null);const max=Math.max(...all)*1.1||1,min=Math.min(0,...all);const x=i=>pad.l+i*(W-pad.l-pad.r)/Math.max(1,xs.length-1),y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-min)/(max-min));let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">`;for(let t=0;t<=4;t++){const v=min+(max-min)*t/4;s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="muted" x="${pad.l-4}" y="${y(v)+4}" font-size="10" text-anchor="end">${fmt(v)}</text>`;}xs.forEach((d,i)=>s+=`<text class="muted" x="${x(i)}" y="${H-8}" font-size="10" text-anchor="middle">${esc(d)}</text>`);seriesList.forEach(se=>{const pts=se.values.map((v,i)=>v==null?null:`${x(i)},${y(v)}`).filter(Boolean);s+=`<polyline fill="none" stroke="${se.color}" stroke-width="2" points="${pts.join(" ")}"/>`;se.values.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(se.name)} ${esc(xs[i])}: ${fmt(v)}</title></circle>`;});const last=se.values.length-1;if(se.values[last]!=null)s+=`<text x="${x(last)+8}" y="${y(se.values[last])+4}" font-size="11">${esc(se.name)}</text>`;});return s+"</svg>";}

const views={};
views.overview=async(m)=>{const s=await data("summary"),opts=await data("options");if(!s){m.innerHTML="<p>No data for this snapshot.</p>";return;}
  m.innerHTML=`<div class="eyebrow">Holdings · ${s.snapshot}</div><h2>Market Overview</h2><p class="lede">Aggregate positioning across every loaded investment option, from trustee Portfolio Holdings Disclosures as at ${s.snapshot}.${s.reference_import?' <span class="pill est">includes reference-imported rows</span>':""}</p>
  <div class="tiles"><div class="tile"><div class="n">${s.funds}</div><div class="l">super funds</div></div><div class="tile"><div class="n">${s.options}</div><div class="l">investment options</div></div><div class="tile"><div class="n">${s.rows.toLocaleString()}</div><div class="l">holding line items</div></div><div class="tile"><div class="n">${fmt$(s.aum)}</div><div class="l">option-level AUM</div></div><div class="tile"><div class="n">${pct(s.listed_pct)}</div><div class="l">listed</div></div><div class="tile"><div class="n">${pct(s.illiquid_pct)}</div><div class="l">PE + unlisted infra & property</div></div><div class="tile"><div class="n">${pct(s.external_pct)}</div><div class="l">disclosed external pooled</div></div></div>
  <div class="card"><h3 style="margin-top:0">Aggregate asset allocation — AUM-weighted</h3><div id="agg"></div>${legend(BUCKETS)}<div class="tbl"><table><tr>${BUCKETS.map(b=>`<th class="num">${b}</th>`).join("")}</tr><tr>${BUCKETS.map(b=>`<td class="num">${pct(s.alloc[b])}</td>`).join("")}</tr></table></div></div>
  <div class="grid2"><div class="card"><h3 style="margin-top:0">AUM by option</h3><div id="aum"></div></div><div class="card"><h3 style="margin-top:0">Top holdings — universe roll-up</h3><div id="top"></div><p class="note">Named managers appear here when a fund discloses a pooled sleeve as one line. Geography: ${s.geo.slice(0,6).map(g=>`${esc(g.geo)} ${fmt$(g.value)}`).join(" · ")}</p></div></div>
  <div class="card"><h3 style="margin-top:0">Liquidity profile by option</h3><div id="liq"></div><div class="legend"><span style="--c:var(--s1)">Listed</span><span style="--c:var(--s2)">Illiquid (PE, unlisted infra & property)</span><span style="--c:var(--s9)">Other unlisted / cash</span></div></div>`;
  $("#agg").appendChild(stack(s.alloc,"Universe"));
  $("#aum").appendChild(barRows(opts.slice(0,40),{label:short,value:o=>o.aum,onclick:o=>{location.hash="#fund?o="+encodeURIComponent(o.fund_id+"|"+o.option_name)}}));
  $("#top").appendChild(table([{h:"Holding",k:"name"},{h:"AUM",k:"value",num:1,f:fmt$},{h:"% univ.",k:"pct",num:1,f:pct}],s.top_holdings.slice(0,20)));
  const liq=$("#liq");opts.forEach(o=>{const r=document.createElement("div");r.className="bar-row";r.innerHTML=`<div class="lbl">${esc(short(o))}</div><div class="stack" style="height:12px"><i style="width:${o.listed_pct}%;background:var(--s1)"></i><i style="width:${o.illiquid_pct}%;background:var(--s2)"></i><i style="width:${Math.max(0,100-o.listed_pct-o.illiquid_pct)}%;background:var(--s9)"></i></div><div class="val">${pct(o.listed_pct)} listed</div>`;liq.appendChild(r);});};

views.compare=async(m)=>{const opts=await data("options");const F=await data("funds");const funds=F?F.funds:[];
  const TYPE_ORDER=["Default","Balanced","Growth","High Growth","Conservative","Sustainable","Single Sector","Cash","Other"];
  const TYPE_LABEL={"Default":"MySuper default options","Balanced":"Balanced options","Growth":"Growth options","High Growth":"High Growth options","Conservative":"Conservative options","Sustainable":"Sustainable / ethical options","Single Sector":"Single-sector options","Cash":"Cash options","Other":"Other options"};
  let mode="funds";
  m.innerHTML=`<div class="eyebrow">Holdings</div><h2>Fund Comparison</h2><p class="lede">Start with the fund as a whole — every option we hold for it, AUM-weighted into one allocation — then open the portfolio types beneath it: each fund's MySuper default, then Balanced against Balanced, Conservative against Conservative, and so on, each compared with the average of its own peers.</p>
  <div class="controls" id="ctl"></div><div id="body"></div>`;
  const ctl=$("#ctl");const body=$("#body");
  const render=()=>{ctl.innerHTML=`<button class="${mode==="funds"?"on":""}" data-m="funds">Funds as a whole (${funds.length})</button><button class="${mode==="types"?"on":""}" data-m="types">By portfolio type</button>`;ctl.querySelectorAll("button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
    if(mode==="funds"){body.innerHTML=`<div class="card"><div class="note" style="margin-bottom:6px">Whole of loaded portfolio per fund, largest first. Coverage differs: for the big funds the disclosure file covers one or two options; for smaller funds every option. Hover a segment for the value; "loaded" shows how many options and which types are behind the bar.</div><div id="fb"></div>${legend(BUCKETS)}</div>
      <div class="card"><h3 style="margin-top:0">Fund vs average of all funds — percentage points</h3><div class="note">Simple average across the ${funds.length} funds (each fund counts once). Positive = overweight.</div><div id="ft"></div></div>`;
      const fb=$("#fb");funds.forEach(f=>{const r=document.createElement("div");r.className="bar-row";r.innerHTML=`<div class="lbl" title="${esc(f.fund_name)}">${esc(f.fund_name)}<br><span class="note">${fmt$(f.aum)} · ${f.options} option${f.options===1?"":"s"} loaded${f.default_option?` · default: ${esc(f.default_option)}`:""}${f.source==="reference-import"?" · <span class=\"pill\">ref</span>":""}</span></div><div></div><div class="val">${pct(f.growth_pct)} growth</div>`;r.children[1].appendChild(stack(f.alloc,f.fund_name));r.style.cursor="pointer";r.onclick=()=>{location.hash=`#fund?fund_id=${f.fund_id}`;};fb.appendChild(r);});
      $("#ft").innerHTML="";$("#ft").appendChild(table([{h:"Fund",k:"fund_name"},{h:"AUM",k:"aum",num:1,f:fmt$},...BUCKETS.map(b=>({h:b,k:b,num:1,f:delta}))],funds.map(f=>({fund_name:f.fund_name,aum:f.aum,...f.delta_vs_avg}))));}
    else{let html="";TYPE_ORDER.forEach(t=>{const rows=opts.filter(o=>(t==="Default"?o.is_default:o.option_type===t&&!o.is_default)).sort((a,b)=>b.aum-a.aum);if(!rows.length)return;
        const peers=rows.filter(o=>!["futuresuper","smartmonday"].includes(o.fund_id));const avg={};BUCKETS.forEach(b=>avg[b]=peers.reduce((a,o)=>a+o.alloc[b],0)/Math.max(1,peers.length));
        html+=`<h3 style="margin:18px 0 4px">${esc(TYPE_LABEL[t]||t)} <span class="note">${rows.length} option${rows.length===1?"":"s"} across ${new Set(rows.map(o=>o.fund_id)).size} funds</span></h3>${t==="Default"?'<p class="note" style="margin:0 0 6px">Each fund\'s MySuper default as registered in config/default_options.csv. Where the disclosure file labels the default differently (e.g. Rest\'s Core Strategy appears as "Growth"), the crosswalk is marked unverified in that file.</p>':""}<div class="card" id="tb-${t.replace(/\W/g,"")}"><div class="bars"></div>${legend(BUCKETS)}<h4 style="margin:12px 0 4px">vs ${esc(TYPE_LABEL[t]||t)} peer average — percentage points</h4><div class="tbl"></div></div>`;

  if(snaps.length>=2){const a=ts[snaps[snaps.length-2]].managers,b=ts[snaps[snaps.length-1]].managers;const ma=Object.fromEntries(a.map(x=>[x.manager,x.value])),mb=Object.fromEntries(b.map(x=>[x.manager,x.value]));const rows=[...new Set([...Object.keys(ma),...Object.keys(mb)])].map(k=>({manager:k,before:ma[k]||0,after:mb[k]||0,change:(mb[k]||0)-(ma[k]||0)})).sort((x,y)=>Math.abs(y.change)-Math.abs(x.change));$("#mf").appendChild(table([{h:"Manager",k:"manager"},{h:snaps[snaps.length-2],k:"before",num:1,f:fmt$},{h:snaps[snaps.length-1],k:"after",num:1,f:fmt$},{h:"Change",k:"change",num:1,f:v=>`<span class="${v>0?"delta-pos":v<0?"delta-neg":""}">${fmt$(v)}</span>`}],rows.slice(0,60)));}};

views.apra=async(m)=>{const d=await data("apra");
  m.innerHTML=`<div class="eyebrow">Regulator data</div><h2>APRA Strategic Allocation</h2><p class="lede">Strategic allocation targets and permitted ranges each trustee reports to APRA for MySuper products (SRF 550.0, published in the Quarterly Superannuation Product Statistics, Table 8a). Targets, not holdings.</p>${d&&d.length?"":'<p class="note">Not loaded for this snapshot. Run <code>python -m pipeline.cli apra</code> (needs internet access to apra.gov.au) or import the reference SAA file.</p>'}<div class="controls"><button id="ph" class="on">Only funds with holdings data</button></div><div class="card"><div id="rows"></div>${legend(BUCKETS)}</div><div class="card"><h3 style="margin-top:0">Credit exposure — strategic targets (top 20)</h3><div id="cr"></div></div>`;
  if(!d||!d.length)return;let only=true;const rend=()=>{const rows=d.filter(x=>!only||x.has_holdings).sort((a,b)=>(b.assets||0)-(a.assets||0));const box=$("#rows");box.innerHTML="";rows.forEach(x=>{const r=document.createElement("div");r.className="bar-row";r.innerHTML=`<div class="lbl" title="${esc(x.product+" · "+x.stage)}">${esc(x.fund_name)}${x.has_holdings?' <span class="pill ok">PHD</span>':""}</div><div></div><div class="val">${fmt$(x.assets)}</div>`;r.children[1].appendChild(stack(x.alloc,x.fund_name+" · "+x.stage));box.appendChild(r);});};$("#ph").onclick=()=>{only=!only;$("#ph").classList.toggle("on",only);rend();};rend();
  const credit=d.map(x=>({fund_name:x.fund_name,stage:x.stage,target:x.granular.filter(g=>/credit/i.test(g.c)).reduce((a,g)=>a+g.t,0),upper:x.granular.filter(g=>/credit/i.test(g.c)).reduce((a,g)=>a+(g.up||0),0)})).filter(x=>x.target>0).sort((a,b)=>b.target-a.target).slice(0,20);$("#cr").appendChild(barRows(credit,{label:x=>x.fund_name+" · "+x.stage,value:x=>x.target,fmt:v=>pct(v)}));};

views.profiles=async(m,params)=>{const r=await fetch("data/fund_profiles.json");const P=r.ok?await r.json():null;if(!P){m.innerHTML="<p>No profile data.</p>";return;}
  const TH={"Sustainability":"var(--s6)","Gender equality":"var(--s7)","Work safety":"var(--s2)","Housing & community":"var(--s1)","Governance & trust":"var(--s9)"};
  const chip=t=>`<span class="pill" style="background:${TH[t]||"var(--code)"};color:#fff">${esc(t)}</span>`;
  const conf=c=>c==="verified"?'<span class="pill ok">sourced</span>':c==="legacy"?'<span class="pill">legacy</span>':'<span class="pill est">partly inferred</span>';
  const types=[...new Set(P.funds.map(f=>f.fund_type.split(" (")[0]))].sort();
  m.innerHTML=`<div class="eyebrow">Who the members are</div><h2>Fund Profiles</h2>
  <p class="note">Member base, demographics and the values each membership has expressed through its fund — as stated by the fund, its members or the press. Member counts and assets: APRA annual fund-level statistics via SuperGuide, ${esc(P.as_of)}. Lines marked <i>inferred</i> are reasoned from a fund's heritage, not disclosed. Click a theme to filter.</p>
  <div class="card"><b>What the press keeps coming back to</b>${P.context.map(c=>`<p style="margin:8px 0 0">${chip(c.theme)} ${esc(c.fact)} <a class="note" href="${esc(c.source)}" target="_blank" rel="noopener">${esc(c.date)} ↗</a></p>`).join("")}</div>
  <div class="controls"><label>Theme <select id="pt"><option value="">All</option>${P.themes.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
  <label>Fund type <select id="pf"><option value="">All</option>${types.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
  <label>Search <input id="pq" placeholder="fund, occupation, word…"></label> <span class="note" id="pc"></span></div><div id="plist"></div>`;
  const render=()=>{const t=$("#pt").value,ft=$("#pf").value,q=$("#pq").value.toLowerCase();
    const fs=P.funds.filter(f=>(!t||f.themes.some(x=>x.theme===t))&&(!ft||f.fund_type.startsWith(ft))&&(!q||JSON.stringify(f).toLowerCase().includes(q))).sort((a,b)=>(b.members||0)-(a.members||0));
    $("#pc").textContent=`${fs.length} of ${P.funds.length} funds`;
    $("#plist").innerHTML=fs.map(f=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline"><div><b style="font-size:16px">${esc(f.fund_name)}</b> <span class="note">${esc(f.fund_type)}</span></div><div>${f.themes.map(x=>chip(x.theme)).join(" ")} ${conf(f.confidence)}</div></div>
      <div class="grid2" style="margin-top:8px"><div><div class="note">Members</div><b>${f.members?f.members.toLocaleString():"—"}</b> &nbsp; <div class="note" style="display:inline">Assets</div> <b>${f.aum_bn?"$"+f.aum_bn.toFixed(1)+"bn":"—"}</b>
        <p style="margin:6px 0 0"><span class="note">Heritage</span><br>${esc(f.heritage)}</p></div>
        <div><p style="margin:0"><span class="note">Member base</span><br>${esc(f.member_base)}</p><p style="margin:6px 0 0"><span class="note">Demographics</span><br>${esc(f.demographics).replace(/Inferred:/g,"<i>Inferred:</i>")}</p></div></div>
      ${f.themes.length?`<div style="margin-top:8px"><span class="note">Values the membership has expressed</span>${f.themes.filter(x=>!t||x.theme===t).map(x=>`<p style="margin:4px 0 0">${chip(x.theme)} ${esc(x.evidence)} <a class="note" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.date)} ↗</a></p>`).join("")}</div>`:`<p class="note" style="margin-top:8px">No member-values coverage recorded.</p>`}
      <p class="note" style="margin:8px 0 0"><a href="#fund?fund_id=${esc(f.fund_id)}">Holdings deep-dive →</a></p></div>`).join("");};
  ["pt","pf"].forEach(id=>$("#"+id).onchange=render);$("#pq").oninput=render;if(params.get("theme")){$("#pt").value=params.get("theme");}render();};
views.owners=async(m)=>{const r=await fetch("data/asset_owners.json");const A=r.ok?await r.json():null;if(!A){m.innerHTML="<p>No asset-owner data.</p>";return;}
  const badge=(v,lbl)=>`<span class="pill ${v==="full"?"ok":v==="partial"?"est":""}" title="${esc(lbl)}: ${esc(v)}">${esc(lbl)}: ${esc(v)}</span>`;
  const conf=c=>c==="sourced"?'<span class="pill ok">sourced</span>':'<span class="pill est">partly to confirm</span>';
  m.innerHTML=`<div class="eyebrow">Beyond superannuation</div><h2>Asset Owners</h2>
  <p class="note">Sovereign and state investment funds, state insurers, New Zealand Crown investors and life insurers with investment products — what each publishes, and where. These sit outside the Portfolio Holdings Disclosure regime, so the table records disclosure <i>coverage</i> rather than holdings. Figures carry their as-at date; "to confirm" means no primary-source figure was verified yet.</p>
  <div class="card"><b>How to read this universe</b>${A.context.map(c=>`<p style="margin:8px 0 0">${esc(c)}</p>`).join("")}</div>
  <div class="controls"><label>Group <select id="og"><option value="">All</option>${A.groups.map(g=>`<option>${esc(g)}</option>`).join("")}</select></label>
  <label>Publishes managers <select id="om"><option value="">Any</option><option>full</option><option>partial</option><option>none</option></select></label>
  <label>Publishes holdings <select id="oh"><option value="">Any</option><option>full</option><option>partial</option><option>none</option></select></label>
  <label>Search <input id="oq" placeholder="entity, manager, mandate…"></label> <span class="note" id="oc"></span></div><div id="olist"></div>`;
  const render=()=>{const g=$("#og").value,mm=$("#om").value,hh=$("#oh").value,q=$("#oq").value.toLowerCase();
    const es=A.entities.filter(e=>(!g||e.group===g)&&(!mm||e.managers_published===mm)&&(!hh||e.holdings_published===hh)&&(!q||JSON.stringify(e).toLowerCase().includes(q)));
    $("#oc").textContent=`${es.length} of ${A.entities.length} entities`;
    let html="";A.groups.forEach(gr=>{const rows=es.filter(e=>e.group===gr).sort((a,b)=>(b.aum_bn||0)-(a.aum_bn||0));if(!rows.length)return;
      html+=`<h3 style="margin:18px 0 6px">${esc(gr)}</h3>`;
      html+=rows.map(e=>{const alloc=Object.entries(e.allocation||{});const total=alloc.reduce((a,[,v])=>a+v,0);
        return `<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline"><div><b style="font-size:16px">${esc(e.name)}</b> <span class="note">${esc(e.jurisdiction)}</span></div><div>${badge(e.managers_published,"managers")} ${badge(e.holdings_published,"holdings")} ${conf(e.confidence)}</div></div>
        <div class="grid2" style="margin-top:8px"><div><div class="note">Size</div><b>${e.aum_bn?esc(e.currency)+e.aum_bn.toFixed(1)+"bn":"to confirm"}</b> <span class="note">${esc(e.aum_asof)}</span>
          <p style="margin:6px 0 0"><span class="note">Run by</span><br>${esc(e.run_by)}</p><p style="margin:6px 0 0"><span class="note">Refresh</span><br>${esc(e.cadence)}</p></div>
          <div><p style="margin:0"><span class="note">Mandate</span><br>${esc(e.mandate)}</p>${e.notes?`<p class="note" style="margin:6px 0 0">${esc(e.notes)}</p>`:""}</div></div>
        ${alloc.length?`<div style="margin-top:8px"><span class="note">Published allocation (%)</span><div class="stack" style="margin-top:4px">${alloc.map(([k,v],i)=>`<i style="width:${v/Math.max(total,100)*100}%;background:var(--s${(i%10)+1})" title="${esc(k)} ${v}%"></i>`).join("")}</div><div class="legend">${alloc.map(([k,v],i)=>`<span style="--c:var(--s${(i%10)+1})">${esc(k)} ${v}%</span>`).join("")}</div></div>`:""}
        <p style="margin:8px 0 0"><span class="note">Managers</span> ${esc(e.managers_note||"—")} ${e.managers_url?`<a class="note" href="${esc(e.managers_url)}" target="_blank" rel="noopener">source ↗</a>`:""}</p>
        ${e.holdings_note?`<p style="margin:4px 0 0"><span class="note">Holdings</span> ${esc(e.holdings_note)} ${e.holdings_url?`<a class="note" href="${esc(e.holdings_url)}" target="_blank" rel="noopener">source ↗</a>`:""}</p>`:""}
        <p class="note" style="margin:6px 0 0">Sources: ${e.sources.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">[${i+1}]</a>`).join(" ")}</p></div>`;}).join("");});
    $("#olist").innerHTML=html||'<p class="note">Nothing matches.</p>';};
  ["og","om","oh"].forEach(id=>$("#"+id).onchange=render);$("#oq").oninput=render;render();};
views.quality=async(m)=>{const q=await data("quality");if(!q){m.innerHTML="<p>No quality data.</p>";return;}
  m.innerHTML=`<div class="eyebrow">Provenance</div><h2>Data Quality</h2><p class="lede">Every refresh publishes its own audit: what was harvested, what failed the gates and why, how each row's geography and asset class were determined, and how many identifiers survived parsing.</p>
  <div class="tiles"><div class="tile"><div class="n">${q.identifiers.rows.toLocaleString()}</div><div class="l">rows loaded</div></div><div class="tile"><div class="n">${pct(q.identifiers.isin/q.identifiers.rows*100)}</div><div class="l">rows with ISIN</div></div><div class="tile"><div class="n">${pct(q.identifiers.ticker/q.identifiers.rows*100)}</div><div class="l">rows with ticker</div></div><div class="tile"><div class="n">${q.quarantined.length}</div><div class="l">options quarantined</div></div><div class="tile"><div class="n">${Object.keys(q.harvest_errors).length}</div><div class="l">funds with harvest problems</div></div></div>
  <div class="grid2"><div class="card"><h3 style="margin-top:0">Quarantined options (excluded from every page)</h3>${q.quarantined.length?"":'<p class="note">None.</p>'}<div id="qq"></div></div><div class="card"><h3 style="margin-top:0">Harvest problems</h3>${Object.keys(q.harvest_errors).length?`<ul>${Object.entries(q.harvest_errors).map(([k,v])=>`<li><b>${esc(k)}</b>: ${esc(v.join("; "))}</li>`).join("")}</ul>`:'<p class="note">None recorded (or this snapshot was imported rather than harvested).</p>'}<h3>APRA layer status</h3><ul>${Object.entries(q.apra_status).map(([k,v])=>`<li><b>${esc(k)}</b>: ${esc(v)}</li>`).join("")||"<li class=note>not run</li>"}</ul></div></div>
  <div class="grid2"><div class="card"><h3 style="margin-top:0">Geography method</h3><div id="gm"></div></div><div class="card"><h3 style="margin-top:0">Most common quality flags</h3><div id="fl"></div></div></div>`;
  if(q.quarantined.length)$("#qq").appendChild(table([{h:"Fund",k:"fund_id"},{h:"Option",k:"option_name"},{h:"Rows",k:"rows",num:1},{h:"Reasons",k:"reasons",f:v=>v.map(esc).join("<br>")}],q.quarantined));
  $("#gm").appendChild(barRows(q.geography_methods,{label:x=>x.method,value:x=>x.rows,fmt:v=>v.toLocaleString()}));$("#fl").appendChild(barRows(q.flags,{label:x=>x.flag,value:x=>x.rows,fmt:v=>v.toLocaleString()}));};

views.method=async(m)=>{m.innerHTML=`<div class="eyebrow">How to read this</div><h2>Methodology</h2>
<div class="card"><h3 style="margin-top:0">Sources</h3><p><b>Holdings.</b> Trustee Portfolio Holdings Disclosures under Corporations Regulations 2001 reg 7.9.07Z and Schedule 8D: snapshots at 30 June and 31 December, published on each fund's website within 90 days. Listed equity is disclosed position by position; fixed income item by item with maturity and coupon; externally managed pooled sleeves as one line per manager; derivatives aggregated.</p><p><b>Strategic allocation.</b> APRA Quarterly Superannuation Product Statistics, Performance workbook, Table 8a Investment Strategy (SRF 550.0) — MySuper products and lifecycle stages.</p><p><b>Fees.</b> APRA fee tables (MySuper representative member) and each option's PDS; fund-level investment expenses from APRA's SRS 332.0 expense publication; annual reports.</p></div>
<div class="card"><h3 style="margin-top:0">Pipeline</h3><p>Harvest → parse (generic Schedule 8D reader with per-fund adapters) → normalise to one schema → validation gates (weights, size vs APRA, classification, row count, reporting date) → quarantine failures → enrich (OpenFIGI security master, manager alias table) → aggregate → publish. Every row carries <code>geography_method</code> and <code>data_quality_flag</code>; every snapshot carries the source file hash and pipeline version.</p></div>
<div class="card"><h3 style="margin-top:0">Ten buckets</h3><p>${BUCKETS.join(" · ")}. Funds' own headings are mapped to APRA asset classes then rolled into these buckets by <code>config/asset_class_map.csv</code>. Weights are always recomputed from value ÷ option total; the disclosed weight is kept only for the validation gate.</p></div>
<div class="card"><h3 style="margin-top:0">What is not knowable from public data</h3><p>Fees paid to each named manager (estimated from mandate size and strategy fee ranges, reconciled to disclosed option fees where possible); the manager behind a segregated listed-equity mandate (disclosed as securities, not as a manager); look-through of pooled vehicles that funds report as a single line.</p></div>`;};

async function route(){const [page,qs]=(location.hash.slice(1)||"overview").split("?");const params=new URLSearchParams(qs||"");$("#nav").querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.dataset.p===page));const m=$("#main");m.innerHTML='<p class="note">Loading…</p>';try{await (views[page]||views.overview)(m,params);}catch(e){m.innerHTML=`<p class="note">Could not render this page: ${esc(e.message)}</p>`;console.error(e);}window.scrollTo(0,0);}
(async()=>{$("#nav").innerHTML=PAGES.map(([p,l])=>`<a href="#${p}" data-p="${p}">${l}</a>`).join("");const r=await fetch("data/index.json");state.index=r.ok?await r.json():{snapshots:[]};const sel=$("#snap");sel.innerHTML=state.index.snapshots.slice().reverse().map(s=>`<option>${s}</option>`).join("");state.snap=state.index.latest;$("#built").textContent=state.index.built_at?`Built ${state.index.built_at} · pipeline ${state.index.pipeline_version}`:"";sel.onchange=()=>{state.snap=sel.value;route();};window.addEventListener("hashchange",route);route();})();
</script>
