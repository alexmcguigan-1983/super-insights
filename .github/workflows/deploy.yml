# Publish the dashboard whenever main changes (e.g. after a refresh PR is merged).
#
# Two hosts are supported and chosen automatically:
#   * Cloudflare Pages  — used when the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist.
#                         Put Cloudflare Access in front of it to require sign-in (docs/ACCESS.md).
#   * GitHub Pages      — used otherwise (public repositories only on the free plan).
name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.host.outputs.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild per-fund holdings files from curated data
        run: |
          for s in $(ls curated | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'); do
            [ -f "curated/$s/holdings.parquet" ] && python -m pipeline.cli build --snapshot $s || true
          done
      - id: host
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "host=cloudflare" >> $GITHUB_OUTPUT; else echo "host=github" >> $GITHUB_OUTPUT; fi
          echo "Deploy target: $(cat $GITHUB_OUTPUT)"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: steps.host.outputs.host == 'github'
        with:
          path: site

  deploy-cloudflare:
    needs: build
    if: needs.build.outputs.host == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Deploy to Cloudflare Pages (project "super-insights")
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=super-insights --branch=main --commit-dirty=true

  deploy-github:
    needs: build
    if: needs.build.outputs.host == 'github'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
